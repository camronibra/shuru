[project]
name = "shuru"
version = "0.1.0"
description = "Pipeline for collecting and cleaning text in low-resource languages."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Camron Ibrahimi" }]
dependencies = [
    # HTTP client: streaming bodies (so responses can be size-capped), timeouts, typed.
    "httpx>=0.27",
    # HTML parser (lexbor, compiled). The only compiled dependency.
    "selectolax>=0.3.21",
    # Safe XML parsing for RSS/Atom feeds and sitemaps (entity-expansion attacks).
    "defusedxml>=0.7.1",
]

[project.scripts]
shuru = "lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode characters: Persian-script literals are the point here
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Seeded `random` builds synthetic text and shuffles data. It is not used for security.
"tests/**" = ["S101", "S311"]  # assert is fine in tests
"bench/**" = ["S311"]
"scripts/**" = ["S311"]
"src/lab/synth.py" = ["S311"]
"src/lab/model/**" = ["S311"]  # seeded shuffling and sampling

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
