# Copy to /etc/ssh/sshd_config.d/10-hardening.conf, then:
#   sudo sshd -t && sudo systemctl reload ssh
# Keep your current session open until you have logged in again in a second one.
#
# Keys only, no root login, and SSH reachable on the Tailscale interface only.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no

# The jobs' user is never a login user.
DenyUsers shuru

MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Optional, once Tailscale is up: listen on the tailnet address only, so SSH is not
# reachable from the LAN or the internet at all. Find the address with
# `tailscale ip -4`, and keep a local console handy in case you lock yourself out.
#ListenAddress 100.x.y.z
